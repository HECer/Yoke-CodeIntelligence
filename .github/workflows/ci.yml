name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.16.0', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/configured-smoke.mjs
      - run: node scripts/publish-github.mjs --dry-run
      - run: npm pack --dry-run
  vscode-owned-job:
    name: Windows VS Code launcher Job lifecycle (no VSIX acceptance)
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check inert launcher admission adversaries
        timeout-minutes: 1
        run: python -m unittest scripts.tests.test_vscode_owned_job -v
      - name: Probe only owned Python process trees and passed-marker refusal
        timeout-minutes: 2
        run: python scripts/vscode_owned_job.py --ci-probe
      - name: Preserve separate launcher lifecycle receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-owned-job-windows
          path: validation/ci-vscode-owned-job
          if-no-files-found: warn
