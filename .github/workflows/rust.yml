name: Rust core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-shards-linux:
    name: native-shards (${{ matrix.os }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps: &native-shard-steps
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt, rust-analyzer
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Use the same Windows temporary directory by its canonical long path
        if: runner.os == 'Windows'
        run: python scripts/ci_windows_temp.py
      - name: Use a canonical macOS temporary root
        if: runner.os == 'macOS'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const root = fs.realpathSync(os.tmpdir());
          if (!path.isAbsolute(root) || /[\x00-\x1f\x7f]/.test(root) || !fs.statSync(root).isDirectory()) {
            throw new Error('Canonical temporary root must be an ordinary absolute directory');
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `TMPDIR=${root}\n`, 'utf8');
          console.log(`Canonical temporary root: ${root}`);
          NODE
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-shard-${{ matrix.shard }}
      - run: npm ci
      - run: python -m unittest discover -s scripts/tests -v
        id: python_tests
        if: matrix.shard == 0
      - name: Observe Unix memory APIs without native acceptance claims
        if: matrix.shard == 0 && runner.os != 'Windows'
        run: python scripts/host_memory_probe.py
      - name: Preserve Unix memory API diagnostics (JSON and logs only)
        if: always() && matrix.shard == 0 && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: host-memory-diagnostic-${{ matrix.os }}
          path: validation/ci-host-memory
          if-no-files-found: warn
      - name: Check all native format roots on Windows
        if: matrix.shard == 0 && runner.os == 'Windows'
        run: python scripts/native_fmt.py --check
      - name: Check native formatting on Unix
        if: matrix.shard == 0 && runner.os != 'Windows'
        run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked --keep-going -j 2 -- -D warnings
        if: matrix.shard == 0
      # Each original Cargo target stays whole. Windows fixtures remain serial;
      # concurrency adversaries retain their original internal threads.
      - name: Test complete default Cargo target groups
        id: native_tests
        run: python scripts/native_shards.py run --index ${{ matrix.shard }}
      - name: Observe owned PowerShell startup after a failed Windows shard
        id: powershell_probe
        if: failure() && runner.os == 'Windows' && (steps.python_tests.outcome == 'failure' || steps.native_tests.outcome == 'failure')
        timeout-minutes: 2
        run: python scripts/host_powershell_probe.py --output validation/ci-host-powershell
      - name: Preserve separate PowerShell diagnostics (never native acceptance)
        if: always() && runner.os == 'Windows' && (steps.python_tests.outcome == 'failure' || steps.native_tests.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: host-powershell-diagnostic-${{ matrix.shard }}
          path: validation/ci-host-powershell/result.json
          if-no-files-found: warn
      - name: Isolate captured PowerShell output in a separate bounded trial
        if: failure() && runner.os == 'Windows' && (steps.python_tests.outcome == 'failure' || steps.native_tests.outcome == 'failure')
        timeout-minutes: 1
        run: python scripts/host_powershell_probe.py --captured-write-output --output validation/ci-host-powershell-captured
      - name: Preserve captured-output boundary diagnostics
        if: always() && runner.os == 'Windows' && (steps.python_tests.outcome == 'failure' || steps.native_tests.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: host-powershell-captured-diagnostic-${{ matrix.shard }}
          path: validation/ci-host-powershell-captured/result.json
          if-no-files-found: warn
      - name: Preserve complete or partial shard receipts and raw group logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-shard-${{ matrix.os }}-${{ matrix.shard }}
          path: validation/ci-native-shard
          if-no-files-found: warn
  native-shards-windows:
    name: native-shards (${{ matrix.os }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps: *native-shard-steps
  native-shards-macos:
    name: native-shards (${{ matrix.os }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps: *native-shard-steps
  native-rust-linux:
    name: native-rust (${{ matrix.os }})
    needs: native-shards-linux
    # A different platform's failure cannot replace this platform's evidence.
    if: always() && !cancelled()
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps: &native-acceptance-steps
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt, rust-analyzer
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Use the same Windows temporary directory by its canonical long path
        if: runner.os == 'Windows'
        run: python scripts/ci_windows_temp.py
      - name: Use a canonical macOS temporary root
        if: runner.os == 'macOS'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const root = fs.realpathSync(os.tmpdir());
          if (!path.isAbsolute(root) || /[\x00-\x1f\x7f]/.test(root) || !fs.statSync(root).isDirectory()) {
            throw new Error('Canonical temporary root must be an ordinary absolute directory');
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `TMPDIR=${root}\n`, 'utf8');
          console.log(`Canonical temporary root: ${root}`);
          NODE
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Download this platform's evidence from this workflow run
        uses: actions/download-artifact@v4
        with:
          pattern: native-shard-${{ matrix.os }}-*
          path: validation/ci-native-shards-download
      - name: Require every default target exactly once on identical selected inputs
        run: python scripts/native_shards.py check --artifacts validation/ci-native-shards-download
      - name: Preserve target coverage proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-coverage-${{ matrix.os }}
          path: validation/ci-native-coverage.json
          if-no-files-found: warn
      - run: python scripts/run_native_tests.py --controlled-test-runner --locked --test live actual_rust_analyzer -- --ignored
      - run: cargo build --workspace --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: yoke-${{ matrix.os }}
          path: |
            target/release/yoke
            target/release/yoke.exe
      - name: Exercise global document history through the release CLI and owning Sessions
        id: host_history
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: python scripts/host_history_live.py --native target/release/yoke.exe --output validation/ci-host-document-history
      - name: Preserve owned host-history acceptance evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: host-document-history-windows
          path: validation/ci-host-document-history
          if-no-files-found: warn
  native-rust-windows:
    name: native-rust (${{ matrix.os }})
    needs: native-shards-windows
    if: always() && !cancelled()
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps: *native-acceptance-steps
  native-rust-macos:
    name: native-rust (${{ matrix.os }})
    needs: native-shards-macos
    if: always() && !cancelled()
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps: *native-acceptance-steps
