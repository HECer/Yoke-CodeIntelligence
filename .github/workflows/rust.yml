name: Rust core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt, rust-analyzer
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: python -m unittest discover -s scripts/tests -v
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked --keep-going -j 2 -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast -j 2 -- --test-threads=2
      - run: cargo test --locked --test live actual_rust_analyzer -- --ignored
      - run: cargo build --workspace --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: yoke-${{ matrix.os }}
          path: |
            target/release/yoke
            target/release/yoke.exe
