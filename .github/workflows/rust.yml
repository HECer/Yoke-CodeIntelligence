name: Rust core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt, rust-analyzer
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Use a canonical macOS temporary root
        if: runner.os == 'macOS'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const root = fs.realpathSync(os.tmpdir());
          if (!path.isAbsolute(root) || /[\x00-\x1f\x7f]/.test(root) || !fs.statSync(root).isDirectory()) {
            throw new Error('Canonical temporary root must be an ordinary absolute directory');
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `TMPDIR=${root}\n`, 'utf8');
          console.log(`Canonical temporary root: ${root}`);
          NODE
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: python -m unittest discover -s scripts/tests -v
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked --keep-going -j 2 -- -D warnings
      # Independent Windows fixtures share ancestors protected against write/delete opens.
      # Concurrency adversaries inside each test keep their original threads and assertions.
      - name: Test native Windows protected namespaces
        if: runner.os == 'Windows'
        run: python scripts/run_native_tests.py --controlled-test-runner --workspace --locked --no-fail-fast -j 2 -- --test-threads=1
      - name: Test native Unix targets
        if: runner.os != 'Windows'
        run: python scripts/run_native_tests.py --controlled-test-runner --workspace --locked --no-fail-fast -j 2 -- --test-threads=2
      - run: python scripts/run_native_tests.py --controlled-test-runner --locked --test live actual_rust_analyzer -- --ignored
      - run: cargo build --workspace --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: yoke-${{ matrix.os }}
          path: |
            target/release/yoke
            target/release/yoke.exe
