[package]
name = "yoke-code-intelligence"
version = "0.5.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
description = "Local source-bound code intelligence, directed graphs and guarded changes"

[lib]
name = "yoke"

[[bin]]
name = "yoke"
path = "src/main.rs"

[dependencies]
aws-sigv4 = { version = "=1.6.0", default-features = false, features = ["sign-http", "http1"] }
aws-credential-types = { version = "=1.3.0", default-features = false }
ed25519-dalek = "=2.2.0"
zeroize = "1.9"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hmac = "=0.12.1"
ring = "=0.17.14"
fs2 = "0.4"
leiden-rs = { version = "0.8.1", default-features = false }
process-wrap = { version = "8.2.2", features = ["std"] }
ignore = "0.4"
rayon = "1"
regex = "1"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls-no-provider", "query"] }
rusqlite = { version = "0.37", features = ["bundled", "hooks", "limits"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-native-certs = "=0.8.4"
rcgen = "0.13"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "=1.53.3", features = ["rt", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "=1.1.8"
quick-xml = "=0.42.0"
zip = { version = "=9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
pulldown-cmark = { version = "=0.13.4", default-features = false }
yaml-rust2 = { version = "=0.13.0", default-features = false }
sha2 = "0.10"
sha1 = "=0.10.7"
similar = "2"
tree-sitter = "0.25.10"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-swift = "0.7.4"
tree-sitter-scala = "0.26.2"
tree-sitter-lua = "0.5"
tree-sitter-bash = "0.25.1"
tree-sitter-elixir = "0.3.5"
tree-sitter-solidity = "1.2.13"
tree-sitter-ocaml = "0.26"
tree-sitter-zig = "1.1.2"
tree-sitter-nix = "0.3"
tree-sitter-r = "1.3"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-dart = "0.2"
tree-sitter-clojure-orchard = "0.2.8"
tree-sitter-powershell = "=0.26.4"
tree-sitter-julia = "=0.23.1"
tree-sitter-objc = "=3.0.2"
tree-sitter-fortran = "=0.6.0"
tree-sitter-erlang = "=0.21.0"
tree-sitter-commonlisp = "=0.4.1"
tree-sitter-pascal = "=0.10.2"
tree-sitter-vb-dotnet = "=0.1.0"
tree-sitter-verilog = "=1.0.3"
tree-sitter-hcl = "=1.1.0"
tree-sitter-sfapex = "=3.0.1"
url = "2"
tempfile = "3"
httparse = "1.10.1"
getrandom = "0.4.3"
subtle = "2.6.1"
unicode-normalization = "0.1"
base64 = "0.22.1"
lopdf = { version = "=0.42.0", default-features = false }

[dev-dependencies]

[target.'cfg(windows)'.dev-dependencies]
find-msvc-tools = "=0.1.14"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }
security-framework = "3"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }
secret-service = { version = "=4.0.0", default-features = false, features = ["rt-async-io-crypto-rust"] }
zbus = { version = "4", default-features = false, features = ["async-io"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

