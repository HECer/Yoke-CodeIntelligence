[package]
name = "yoke-code-intelligence"
version = "0.4.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "Local source-bound code intelligence, directed graphs and guarded changes"

[lib]
name = "yoke"

[[bin]]
name = "yoke"
path = "src/main.rs"

[dependencies]
ed25519-dalek = "=2.2.0"
zeroize = "1.9"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
fs2 = "0.4"
leiden-rs = { version = "0.8.1", default-features = false }
process-wrap = { version = "8.2.2", features = ["std"] }
ignore = "0.4"
rayon = "1"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
tree-sitter = "0.25.10"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-swift = "0.7.4"
tree-sitter-scala = "0.26.2"
tree-sitter-lua = "0.5"
tree-sitter-bash = "0.25.1"
tree-sitter-elixir = "0.3.5"
tree-sitter-solidity = "1.2.13"
tree-sitter-ocaml = "0.26"
tree-sitter-zig = "1.1.2"
tree-sitter-nix = "0.3"
tree-sitter-r = "1.3"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-dart = "0.2"
tree-sitter-clojure-orchard = "0.2.8"
url = "2"
tempfile = "3"
httparse = "1.10.1"
getrandom = "0.4.3"
subtle = "2.6.1"
unicode-normalization = "0.1"
base64 = "0.22.1"
lopdf = { version = "=0.42.0", default-features = false }

[dev-dependencies]

